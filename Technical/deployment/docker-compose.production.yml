version: '3.8'

services:
  foodberg-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://foodberg-backend:3001
      - NEXT_PUBLIC_SITE_URL=https://foodberg.org
    depends_on:
      - foodberg-backend
    networks:
      - foodberg-network
    restart: unless-stopped

  foodberg-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=https://foodberg.org
    volumes:
      - ./data:/app/data
    networks:
      - foodberg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - foodberg-frontend
      - foodberg-backend
    networks:
      - foodberg-network
    restart: unless-stopped

networks:
  foodberg-network:
    driver: bridge

volumes:
  ssl-certs:
  app-data: