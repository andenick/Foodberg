    <!-- No-FOUC theme: apply the saved (or system) theme before first paint so the
         page never flashes the wrong palette. Follow-system-then-remember. -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('ark-theme');
                if (t !== 'light' && t !== 'dark') {
                    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                var r = document.documentElement;
                r.classList.toggle('dark', t === 'dark');
                r.setAttribute('data-theme', t);
            } catch (e) { /* never break the page */ }
        })();
    </script>
